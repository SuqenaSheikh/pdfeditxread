name: pdf_editor
description: Folio — a fast PDF reader and lightweight editor.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  flutter_tts: ^4.2.2
  flutter_image_compress: ^2.4.1
  permission_handler: ^11.4.0
  phosphor_flutter: ^2.1.0
  syncfusion_flutter_pdfviewer: ^33.2.12
  syncfusion_flutter_pdf: ^33.2.12
  google_mlkit_document_scanner: ^0.3.0
  google_mlkit_text_recognition: ^0.15.0
  google_mobile_ads: ^5.3.1
  in_app_purchase: ^3.2.1
  collection: ^1.19.1
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
